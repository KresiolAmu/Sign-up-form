<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="bg-img">
        <div class="banner">
            <div id="odin-logo"></div>
            ODIN
        </div>
    </div>
    <section>
        <form action="" method="" autocomplete="off">
            <div class="form-header">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize
                    your deepest dreams. Sign up now to get started.</p>
                <p>You <i>know</i> you want to.</p>
            </div>
            <fieldset>
                <h1>Let's do this!</h1>


                <div class="pair-field">
                    <div class="field">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first-name" placeholder="e.g. Juan"
                            pattern="^[A-Za-z\s]+$" required />
                    </div>
                    <div class="field">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name" placeholder="e.g. Dela Cruz" required />
                    </div>
                </div>
                <div class="pair-field">
                    <div class="field">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="e.g. juandelacruz@gmail.com" required>
                    </div>
                    <div class="field">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="tel" id="phone-number" name="phone-number" minlength="11" maxlength="11"
                            placeholder="e.g. 09123456789" pattern="^(09|\+639)\d{9}$" required>
                    </div>
                </div>
                <div class="pair-field">
                    <div class="field">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" minlength="8" maxlength="40" required>
                    </div>
                    <div class="field">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password" minlength="8"
                            maxlength="40" required>
                    </div>
                </div>


            </fieldset>
            <div class="form-footer">
                <button type="submit">Create Account</button>
                <p>
                    Already have an account? <a href="#">Log in</a>
                </p>
            </div>
        </form>
    </section>

    <script></script>
</body>

</html>
